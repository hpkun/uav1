extends: configs/diag_mappo_learnability_common_3m.yaml

development_method: marc_mappo_v2

training:
  total_sampled_steps: 1000000

modules:
  milestone_aware_retention_credit:
    enabled: true
    version: 2
    max_waves: 3
    continuation_alpha: 1.0
    wave_balance_temperature: 0.5
    wave_weight_min: 0.5
    wave_weight_max: 2.0
    deployment_distill_coefficient: 0.05
    elite_segments_per_wave: 8
    elite_rows_per_segment: 64
    retention_samples_per_wave: 32
    retention_min_rows_per_wave: 32
    retention_stride: 8

development_protocol:
  role: marc_v2_single_seed_development_screen
  primary_checkpoints: [900000, 1000000]
  best_checkpoint_role: diagnostic_only
  validation: {seed_start: 44000000, seed_end: 44000049, episodes: 50, deterministic: true, common_scenarios: true, is_holdout: false}
  contaminated_retired_final_range: {seed_start: 33000000, seed_end: 33000199, status: CONTAMINATED_RETIRED_FINAL_RANGE}
  reserved_future_final_test: {seed_start: 45000000, seed_end: 45000199, executed: false}
