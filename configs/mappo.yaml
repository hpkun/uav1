algorithm: MAPPO
network:
  observation_dim: 52
  action_dim: 3
  num_agents: 4
  actor_hidden_layers: [256, 256]
  critic_hidden_layers: [256, 256]
  attention_heads: 2
training:
  optimizer: Adam
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  value_loss_coefficient: 0.5
  entropy_coefficient: 0.01
  max_grad_norm: 0.5
  rollout_steps: 256
  ppo_epochs: 10
  minibatch_size: 512
  num_train_envs: 24
  total_sampled_steps: 8000000
  evaluation_episodes: 20
  evaluation_interval_sampled_steps: 100000
  device: cpu
  seed: 0
runtime_logging:
  console_interval_sampled_steps: 20000
  recent_episode_window: 100
implementation:
  actor_activation: relu
  critic_activation: relu
  log_std_min: -5.0
  log_std_max: 2.0
  normalize_advantages: true
  clip_value_loss: true
  evaluation_seed_base: 10000000
  checkpoint_interval_sampled_steps: 500000
