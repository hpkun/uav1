algorithm: matd3
environment:
  environment_version: '3.41'
  team_size: 4
network:
  observation_dim: 45
  action_dim: 3
  num_agents: 4
  actor_hidden_layers: [256, 256]
  critic_hidden_layers: [256, 256]
training:
  optimizer: Adam
  actor_learning_rate: 0.0001
  critic_learning_rate: 0.0001
  gamma: 0.99
  tau: 0.001
  policy_delay: 2
  target_policy_noise: 0.2
  target_noise_clip: 0.5
  replay_capacity: 1000000
  minibatch_size: 1024
  learning_starts: 10000
  sampled_steps_per_update: 100
  gradient_updates_per_event: 1
  gradient_clip_norm: 0.5
  diagnostics_interval_updates: 100
  num_train_envs: 16
  total_sampled_steps: 3000000
  evaluation_episodes: 20
  evaluation_interval_sampled_steps: 100000
  device: cuda
  seed: 1
implementation:
  noise_type: ou
  ou_theta: 0.15
  ou_sigma: 0.20
  ou_mu: 0.0
  exploration_scale_start: 1.0
  exploration_scale_end: 0.1
  exploration_decay_sampled_steps: 3000000
  evaluation_mode: deterministic
  evaluation_seed_base: 10000000
  checkpoint_interval_sampled_steps: 500000
runtime_logging:
  console_interval_sampled_steps: 20000
  recent_episode_window: 100
metadata:
  algorithm_structure: CTDE MATD3; four independent deterministic actors; eight independent centralized Q critics
  reference: Ackermann et al. 2019 arXiv 1910.01465; Fujimoto et al. 2018 arXiv 1802.09477
  numerical_provenance: Project adaptation; other agents use detached replay actions in actor loss
