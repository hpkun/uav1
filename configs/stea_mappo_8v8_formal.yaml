algorithm: STEA-MAPPO
network:
  observation_dim: 104
  action_dim: 3
  num_agents: 8
  critic_hidden_layers:
  - 256
  - 256
  attention_heads: 2
  actor_type: stea
  entity_dim: 64
  entity_attention_heads: 2
  spatial_hidden_dim: 128
  gru_hidden_dim: 128
  gru_layers: 1
  recurrent_sequence_length: 32
  critic_type: mlp
training:
  optimizer: Adam
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.0003
  gamma: 0.99
  gae_lambda: 0.95
  clip_ratio: 0.2
  value_loss_coefficient: 0.5
  entropy_coefficient: 0.001
  target_kl: 0.015
  max_grad_norm: 0.5
  rollout_steps: 256
  ppo_epochs: 10
  minibatch_size: 512
  num_train_envs: 16
  total_sampled_steps: 3000000
  evaluation_episodes: 20
  evaluation_interval_sampled_steps: 100000
  device: cuda
  seed: 0
runtime_logging:
  console_interval_sampled_steps: 20000
  recent_episode_window: 100
implementation:
  actor_activation: relu
  critic_activation: relu
  log_std_min: -5.0
  log_std_max: 0.5
  policy_std_mode: state_independent
  log_std_init: -0.5
  mean_head_init_gain: 0.01
  normalize_advantages: true
  clip_value_loss: true
  evaluation_seed_base: 10000000
  checkpoint_interval_sampled_steps: 500000
