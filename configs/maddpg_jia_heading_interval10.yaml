algorithm: maddpg
parameters:
  hidden_dim: 128
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.001
  gamma: 0.99
  tau: 0.005
  batch_size: 128
  buffer_capacity: 200000
  learning_starts: 1024
  update_interval_steps: 10
  updates_per_interval: 1
  exploration_std_mps2: 0.0
  exploration_std_speed: 0.3
  exploration_std_turn: 0.3
  actor_max_grad_norm: 0.5
  critic_max_grad_norm: 10.0
training:
  rollout_length: 128
