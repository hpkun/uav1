schema: Interception/12

environment:
  arena_half_extent: 200.0
  base_x: 0.0
  base_y: 0.0
  breach_radius: 30.0
  danger_radius: 45.0
  capture_radius: 5.0
  dt: 0.1
  episode_steps: 5000
  episode_protocol: resolve_all_one_penalty_trade
  defender_speed_max: 5.0
  defender_acceleration_max: 2.0
  attacker_speed_max: 5.0
  attacker_acceleration_max: 2.0
  defender_initial_speed: 0.0
  attacker_initial_speed: 2.0
  sensing_radius: 600.0
  visible_neighbors: 0
  visible_attackers: 5
  observation_layout: relative_assignment_target_velocity_no_defenders
  assignment_period: 20
  assignment_method: ideal_global_distance_matching
  attack_mode: radial_straight
  # Self capture is credited only to the capturing defender.
  capture_reward: 20.0
  # Each other defender receives this cooperation credit per capture.
  teammate_capture_reward: 5.0
  # Shared once on a 5/5 clean win, per agent's reward channel.
  all_captured_reward: 50.0
  boundary_penalty: 2.0
  defender_oob_retire: true
  penetration_penalty: 50.0
  breach_penalty_mode: per_target
  approach_weight: 0.2
  heading_weight: 0.0
