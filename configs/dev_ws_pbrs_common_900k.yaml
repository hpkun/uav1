algorithm: modular_mappo
network: {observation_dim: 52, action_dim: 3, num_agents: 4, actor_hidden_layers: [256, 256], critic_hidden_layers: [256, 256], attention_heads: 2}
training:
  optimizer: Adam
  actor_learning_rate: 0.0003
  critic_learning_rate: 0.0003
  gamma: 0.999
  gae_lambda: 0.95
  clip_ratio: 0.2
  value_loss_coefficient: 0.5
  entropy_coefficient: 0.01
  max_grad_norm: 0.5
  rollout_steps: 256
  ppo_epochs: 10
  minibatch_size: 512
  num_train_envs: 24
  total_sampled_steps: 900000
  evaluation_episodes: 50
  evaluation_interval_sampled_steps: 100000
  device: cuda
  seed: 5101
runtime_logging: {console_interval_sampled_steps: 20000, recent_episode_window: 100}
implementation: {actor_activation: relu, critic_activation: relu, log_std_min: -5.0, log_std_max: 2.0, normalize_advantages: true, clip_value_loss: true, evaluation_seed_base: 39000000, checkpoint_interval_sampled_steps: 500000}
modules:
  wave_context: {enabled: false, context_target: critic_only, max_waves: 3}
  recurrent_memory: {enabled: false, mode: actor_critic_gru, hidden_dim: 128, sequence_length: 32}
  popart: {enabled: false, beta: 0.999, epsilon: 0.00001}
  multi_wave_reward: {enabled: false, mode: none}
  wave_survival_pbrs: {enabled: false, coefficient: 1.0, potential: progress_times_survival, terminal_zero: true}
  wave_balancing: {enabled: false}
  warm_start: {enabled: false, mode: none}
  curriculum: {enabled: false, stage_mode: fixed_steps, stage1_end: 500000, stage2_end: 1000000}
  policy_anchor: {enabled: false, coefficient: 0.01, schedule: constant}
  entity_attention: {enabled: false, entity_dim: 32, attention_heads: 2}
  advantage_priority: {enabled: false}
  ppo_stabilization: {enabled: false}
  actor_lr_decay: {enabled: true, schedule: delayed_linear, start_step: 600000, end_step: 900000, start_lr: 0.0003, end_lr: 0.0001}
development_protocol:
  role: development_only
  intervention: training_reward_only
  checkpoint_selection: {primary: latest_at_budget, budget: 900000, best_eval_role: secondary_diagnostic_only}
  validation: {seed_start: 39000000, seed_end: 39000049, episodes: 50, common_deterministic_scenarios: true, is_holdout: false}
  reserved_future_final_test: {seed_start: 33000000, seed_end: 33000199, executed: false}
