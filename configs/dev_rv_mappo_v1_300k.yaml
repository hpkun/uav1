extends: configs/diag_mappo_learnability_common_3m.yaml
development_method: rv_mappo_v1
development_branch:
  intervention: reference_variance
  source_sampled_steps: 1505280
  additional_sampled_steps: 300000
  target_sampled_steps: 1805280
  actor_optimizer_restore: true
  critic_optimizer_restore: true
  rng_restore: true
training:
  total_sampled_steps: 1805280
  max_grad_norm: 0.5
modules:
  actor_gradient_clipping:
    enabled: true
    mode: actor_only_fixed_norm
    actor_max_grad_norm: 0.5
    critic_max_grad_norm_unchanged: true
    critic_max_grad_norm: 0.5
  reference_variance:
    enabled: true
    mode: frozen_source_state_dependent_variance
    source_sampled_steps: 1505280
    freeze_current_log_std_head: true
    behavior_uses_reference_mean: false
