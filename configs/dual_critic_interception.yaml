algorithm: dual_critic
parameters:
  hidden_dim: 256
  actor_learning_rate: 0.0001
  critic_learning_rate: 0.001
  gamma: 0.99
  tau: 0.005
  batch_size: 256
  buffer_capacity: 1000000
  learning_starts: 1024
  update_interval_steps: 1
  updates_per_interval: 1
  exploration_std_mps2: 0.2
  target_noise_std_mps2: 0.4
  target_noise_clip_mps2: 1.0
  policy_delay: 2
training:
  rollout_length: 128
