[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-airbase-interception"
version = "1.0.0"
description = "Five-versus-five UAV airbase interception research environment"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "gymnasium>=0.29",
  "matplotlib>=3.6",
  "numpy>=1.24",
  "Pillow>=9.0",
  "PyYAML>=6.0",
  "torch>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "mpmath>=1.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["env*", "algorithm*", "experiment*", "tools*"]
namespaces = false

[tool.setuptools.package-data]
tools = ["replay_template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
